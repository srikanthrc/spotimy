version: '3.8'

services:
  mcp:
    image: spotimy-mcp:latest
    build: .
    container_name: spotimy-mcp-server
    ports:
      - "${HTTP_PORT:-3333}:${HTTP_PORT:-3333}"  # MCP HTTP server
      - "4040:4040"  # Ngrok web interface
    environment:
      # Server configuration
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=${HTTP_PORT:-3333}

      # Spotify API credentials (set these in .env file)
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-}

      # Token storage configuration (multi-user mode)
      - TOKEN_STORE_PATH=/app/data
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}

      # Ngrok configuration
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN:-}
      - NGROK_DOMAIN=${NGROK_DOMAIN:-}
    volumes:
      # Persist encrypted token database (SQLite)
      - spotimy_data:/app/data
      # Mount .env file as read-only for config (API credentials, ngrok settings)
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${HTTP_PORT:-3333}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  spotimy_data:
    driver: local